name: بناء وتصدير APK تطبيق مؤسسة الباقيات الصالحات المعتمد

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. استدعاء كود المشروع
        uses: actions/checkout@v3

      - name: 2. إعداد بيئة Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. إعداد Android SDK و NDK
        uses: android-actions/setup-android@v2

      - name: 4. إعداد بيئة Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 5. تثبيت حزم التجميع
        run: |
          python -m pip install --upgrade pip
          pip install flet buildozer cython

      - name: 6. بناء وتصدير ملف الـ APK
  run: |
     echo "y" | flet build apk app/main_app.py

      - name: 7. رفع وحفظ ملف الـ APK الجاهز
        uses: actions/upload-artifact@v4
        with:
          name: Baqiyat-Salihat-Official-Release-APK
          path: build/apk/*.apk
